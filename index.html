<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tiktok</title>
<style>
  :root{
    --bg: #000;
    --white: #fff;
    --dim: rgba(255,255,255,0.72);
    --dimmer: rgba(255,255,255,0.5);
    --accent: #24F0C0;   /* signature mint-cyan, not TikTok's pink/cyan pair */
    --accent-2: #FF3B5C;
    --glass: rgba(255,255,255,0.14);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }

  .app{
    position:fixed; inset:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    user-select:none;
  }

  /* ---------- TOP NAV ---------- */
  .top-nav{
    position:absolute; top:0; left:0; right:0;
    z-index:40;
    padding: calc(14px + var(--safe-top)) 16px 10px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .top-nav .tabs{
    display:flex; align-items:center; gap:22px;
    pointer-events:auto;
  }
  .top-nav .tab{
    font-size:16px; font-weight:600; letter-spacing:.2px;
    color:var(--dimmer);
    background:none; border:none; padding:6px 2px; cursor:pointer;
    position:relative;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .top-nav .tab.active{ color:var(--white); }
  .top-nav .tab.active::after{
    content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:22px; height:3px; border-radius:3px; background:var(--white);
  }
  .top-nav .search{
    position:absolute; right:16px; top: calc(14px + var(--safe-top));
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.5));
  }

  /* ---------- FEED ---------- */
  .feed-viewport{
    position:absolute; inset:0;
    overflow:hidden;
  }
  .feed-track{
    position:absolute; top:0; left:0; width:100%;
    will-change: transform;
    transition: transform 460ms cubic-bezier(.22,.9,.32,1);
  }
  .slide{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:#000;
  }
  .slide .media-frame{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .slide video{
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
  }
  /* fallback look when a local video file hasn't been dropped in yet */
  .slide.no-media .media-frame{
    background:
      radial-gradient(120% 90% at 30% 12%, rgba(255,255,255,.10), transparent 55%),
      linear-gradient(160deg, var(--tint-a), var(--tint-b));
  }
  .fallback-glyph{
    display:none;
    flex-direction:column; align-items:center; gap:10px;
    color:rgba(255,255,255,.55);
  }
  .slide.no-media .fallback-glyph{ display:flex; }
  .fallback-glyph span{ font-size:12px; letter-spacing:.4px; }

  .gradient-bottom{
    position:absolute; left:0; right:0; bottom:0; height:46%;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.62) 78%, rgba(0,0,0,.78) 100%);
    pointer-events:none;
  }
  .gradient-top{
    position:absolute; left:0; right:0; top:0; height:110px;
    background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0));
    pointer-events:none;
  }

  /* ---------- RIGHT ACTION BAR ---------- */
  .right-actions{
    position:absolute; right:10px; bottom: calc(96px + var(--safe-bottom));
    display:flex; flex-direction:column; align-items:center; gap:19px;
    z-index:20;
  }
  .avatar-wrap{ position:relative; margin-bottom:4px; }
  .avatar{
    width:48px; height:48px; border-radius:50%;
    border:2px solid var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#111;
    background: linear-gradient(135deg, var(--av-a), var(--av-b));
  }
  .follow-badge{
    position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:19px; height:19px; border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px #000;
  }
  .follow-badge svg{ width:11px; height:11px; }

  .action{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; color:var(--white); cursor:pointer;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.45));
  }
  .action .icon-btn{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition: transform 120ms ease;
  }
  .action:active .icon-btn{ transform:scale(.86); }
  .action .count{ font-size:12px; font-weight:600; color:var(--dim); }
  .action.liked svg.heart{ fill:var(--accent-2); stroke:var(--accent-2); }
  .action.saved svg.bookmark{ fill:var(--accent); stroke:var(--accent); }

  .disc{
    width:44px; height:44px; border-radius:50%; margin-top:2px;
    background:
      radial-gradient(circle at center, #111 0 6px, #333 6.5px 8px, #0c0c0c 8.5px 100%);
    border:3px solid #1c1c1c;
    display:flex; align-items:center; justify-content:center;
    animation: spin 5.5s linear infinite;
    animation-play-state: paused;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .disc.spin{ animation-play-state: running; }
  .disc::after{
    content:""; width:14px; height:14px; border-radius:50%;
    background: linear-gradient(135deg, var(--av-a), var(--av-b));
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- BOTTOM-LEFT META ---------- */
  .meta{
    position:absolute; left:16px; right:88px; bottom: calc(84px + var(--safe-bottom));
    z-index:20;
    text-shadow: 0 1px 6px rgba(0,0,0,.4);
  }
  .meta .username{
    font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .meta .username .badge{
    font-size:11px; font-weight:700; color:#111; background:var(--accent);
    padding:1px 6px; border-radius:5px;
  }
  .meta .caption{
    margin-top:6px; font-size:14.5px; line-height:1.35; color:var(--white);
  }
  .meta .hashtags{
    margin-top:4px; font-size:14.5px; font-weight:600; color:var(--white);
  }
  .meta .music-row{
    margin-top:10px; display:flex; align-items:center; gap:8px;
    max-width: 100%;
  }
  .meta .music-row svg{ flex:none; opacity:.9; }
  .music-track{
    overflow:hidden; position:relative; height:18px; flex:1; min-width:0;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .music-track span{
    position:absolute; white-space:nowrap; font-size:13px; color:var(--dim);
    animation: marquee 9s linear infinite;
    padding-left:100%;
  }

  @keyframes marquee{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0;
    z-index:40;
    display:flex; align-items:center; justify-content:space-around;
    padding: 8px 6px calc(10px + var(--safe-bottom));
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55) 40%, rgba(0,0,0,.72));
  }
  .nav-item{
    background:none; border:none; color:var(--dimmer);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:600; cursor:pointer;
    padding:4px 10px;
  }
  .nav-item.active{ color:var(--white); }
  .nav-item.active svg{ stroke:var(--white); }
  .create-btn{
    width:44px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--white);
    position:relative;
  }
  .create-btn::before, .create-btn::after{
    content:""; position:absolute; top:0; bottom:0; width:44px; border-radius:9px; z-index:-1;
  }
  .create-btn::before{ background:var(--accent-2); transform:translateX(-4px); }
  .create-btn::after{ background:var(--accent); transform:translateX(4px); }
  .create-btn svg{ stroke:#111; position:relative; z-index:1; }

  /* progress hint (subtle, real apps often omit — kept minimal) */
  .swipe-hint{
    position:absolute; z-index:30; right:14px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px; opacity:.0;
    transition:opacity .3s ease;
  }

  /* utility */
  svg{ display:block; }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="top-nav">
    <div class="tabs">
      <button class="tab" id="tabFollowing">Community</button>
      <button class="tab" id="tabFollowing">local</button>
      <button class="tab" id="tabFollowing">Following</button>
      <button class="tab" id="tabForYou">Shop</button>
      <button class="tab active" id="tabForYou">For You</button>
    </div>
  </div>
  <div class="search" title="Search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
      <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="feed-viewport">
    <div class="feed-track" id="feedTrack"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-nav>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/>
      </svg>
      Home
    </button>
    <button class="nav-item" data-nav>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2z"/>
      </svg>
      Discover
    </button>
    <button class="nav-item" data-nav>
      <div class="create-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
    </button>
    <button class="nav-item" data-nav>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Inbox
    </button>
    <button class="nav-item" data-nav>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
      </svg>
      Profile
    </button>
  </nav>

</div>

<script>
/* =========================================================
   DATA
   Replace `src` with your local prop video file paths, e.g.
   "videos/scene-01.mp4". If a file is missing, the slide
   falls back to a tinted placeholder so the prop still looks
   intentional on camera.
   ========================================================= */
const VIDEOS = [
  {
    src: "videos/video1.mp4",
    username: "@imamshatibicompetition26",
    handleTag: "Verified",
    caption: "May Allah swt bless him and his parents",
    hashtags: "#bati #the #tiktoker",
    music: "original sound — imamshatibicompetition26",
    likes: "128.4K", comments: "2,481", saves: "9,204", shares: "3,110",
    tintA:"#1b1f3b", tintB:"#0a0c1a", avA:"#FFB37B", avB:"#FF6B6B", initials:"WA"
  },
  {
    src: "videos/video2.mp4",
    username: "@noteperfect",
    handleTag: "Verified",
    caption: "rebuilt this riff 30 times until it felt right. worth it",
    hashtags: "#studio #guitar #process",
    music: "Late Static — Noteperfect",
    likes: "84.9K", comments: "1,203", saves: "5,660", shares: "980",
    tintA:"#241a3d", tintB:"#0e0a1a", avA:"#8ED1FC", avB:"#7B61FF", initials:"NP"
  },
  {
    src: "videos/video3.mp4",
    username: "@corner.kitchen",
    handleTag: "",
    caption: "the trick is you salt it twice, not once. everyone forgets the second time",
    hashtags: "#cooking #kitchenhacks #dinner",
    music: "original sound — corner.kitchen",
    likes: "412K", comments: "6,732", saves: "22.1K", shares: "8,340",
    tintA:"#3a1e14", tintB:"#160a06", avA:"#FFD37B", avB:"#FF8A5B", initials:"CK"
  },
  {
    src: "videos/video4.mp4",
    username: "@lowpoly.dan",
    handleTag: "Verified",
    caption: "rendering this scene took my laptop 11 hours and my sanity 0 hours",
    hashtags: "#3dart #render #indiedev",
    music: "Nightbus — Kaia Ren",
    likes: "56.2K", comments: "874", saves: "3,012", shares: "540",
    tintA:"#0f2e2a", tintB:"#081312", avA:"#6BFFB0", avB:"#24F0C0", initials:"LD"
  },
  {
    src: "videos/video5.mp4",
    username: "@margins.of.error",
    handleTag: "",
    caption: "field notes from the last two weeks. more soon",
    hashtags: "#fieldwork #notebook #research",
    music: "original sound — margins.of.error",
    likes: "19.8K", comments: "331", saves: "1,204", shares: "212",
    tintA:"#2b1030", tintB:"#0f0713", avA:"#FF9BD2", avB:"#C06BFF", initials:"ME"
  }
];

/* =========================================================
   ICONS (all original line-art, drawn for this prop)
   ========================================================= */
const ICON = {
  heart: (on) => `
    <svg class="heart" width="34" height="34" viewBox="0 0 24 24" fill="${on ? 'currentColor':'none'}" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20s-7.2-4.6-9.8-9.1C.6 7.7 2 4.2 5.4 3.4 7.6 2.9 9.8 3.9 12 6.2c2.2-2.3 4.4-3.3 6.6-2.8 3.4.8 4.8 4.3 3.2 7.5C19.2 15.4 12 20 12 20z"/>
    </svg>`,
  comment: () => `
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16v10H9l-5 4V5z"/>
    </svg>`,
  bookmark: (on) => `
    <svg class="bookmark" width="30" height="30" viewBox="0 0 24 24" fill="${on ? 'currentColor':'none'}" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12v18l-6-4.2L6 21V3z"/>
    </svg>`,
  share: () => `
    <svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12 20 5 15 20l-3.5-6.5L4 10.5z"/>
    </svg>`,
  play: () => `
    <svg width="30" height="30" viewBox="0 0 24 24" fill="rgba(255,255,255,.55)"><path d="M8 5v14l11-7z"/></svg>`,
  note: () => `
    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  check: () => `
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

/* =========================================================
   BUILD SLIDES
   ========================================================= */
const track = document.getElementById('feedTrack');

const state = VIDEOS.map(() => ({ liked:false, saved:false }));

function slideHTML(v, i){
  return `
  <section class="slide" data-index="${i}" style="--tint-a:${v.tintA}; --tint-b:${v.tintB}; --av-a:${v.avA}; --av-b:${v.avB};">
    <div class="media-frame">
      <video playsinline loop muted preload="auto" data-src="${v.src}"></video>
      <div class="fallback-glyph">
        ${ICON.play()}
        <span>drop ${v.src} into /videos</span>
      </div>
    </div>
    <div class="gradient-top"></div>
    <div class="gradient-bottom"></div>

    <div class="right-actions">
      <div class="avatar-wrap">
        <div class="avatar">${v.initials}</div>
        <div class="follow-badge">${ICON.check()}</div>
      </div>

      <button class="action" data-action="like">
        <span class="icon-btn">${ICON.heart(false)}</span>
        <span class="count" data-count="likes">${v.likes}</span>
      </button>

      <button class="action" data-action="comment">
        <span class="icon-btn">${ICON.comment()}</span>
        <span class="count">${v.comments}</span>
      </button>

      <button class="action" data-action="save">
        <span class="icon-btn">${ICON.bookmark(false)}</span>
        <span class="count" data-count="saves">${v.saves}</span>
      </button>

      <button class="action" data-action="share">
        <span class="icon-btn">${ICON.share()}</span>
        <span class="count">${v.shares}</span>
      </button>

      <div class="disc"></div>
    </div>

    <div class="meta">
      <div class="username">${v.username} ${v.handleTag ? `<span class="badge">${v.handleTag}</span>`:''}</div>
      <div class="caption">${v.caption}</div>
      <div class="hashtags">${v.hashtags}</div>
      <div class="music-row">
        ${ICON.note()}
        <div class="music-track"><span>${v.music} &nbsp;&nbsp;•&nbsp;&nbsp; ${v.music} &nbsp;&nbsp;•&nbsp;&nbsp;</span></div>
      </div>
    </div>
  </section>`;
}

track.innerHTML = VIDEOS.map(slideHTML).join('');

const slides = Array.from(track.children);

/* wire up video elements + fallback detection */
slides.forEach((slide, i) => {
  const video = slide.querySelector('video');
  const src = video.dataset.src;
  video.addEventListener('error', () => slide.classList.add('no-media'));
  // try to attach the source; if it 404s, the error handler above fires
  video.src = src;
});

/* =========================================================
   FEED NAVIGATION
   ========================================================= */
let current = 0;
let animating = false;
const viewportH = () => window.innerHeight;

function layout(){
  slides.forEach((s, i) => { s.style.height = viewportH() + 'px'; });
  track.style.transform = `translateY(${-current * viewportH()}px)`;
}
window.addEventListener('resize', layout);

function playCurrent(){
  slides.forEach((slide, i) => {
    const video = slide.querySelector('video');
    const disc = slide.querySelector('.disc');
    if (i === current){
      const p = video.play();
      if (p && p.catch) p.catch(()=>{});
      disc.classList.add('spin');
    } else {
      video.pause();
      disc.classList.remove('spin');
      if (Math.abs(i - current) > 1) video.currentTime = 0;
    }
  });
  preloadNeighbors();
}

function preloadNeighbors(){
  [current - 1, current + 1].forEach(i => {
    if (i >= 0 && i < slides.length){
      const v = slides[i].querySelector('video');
      if (v.readyState === 0) v.load();
    }
  });
}

function goTo(index){
  if (animating) return;
  const target = Math.max(0, Math.min(slides.length - 1, index));
  if (target === current) return;
  animating = true;
  current = target;
  track.style.transform = `translateY(${-current * viewportH()}px)`;
  playCurrent();
  window.setTimeout(() => { animating = false; }, 480);
}

/* wheel */
let wheelLock = false;
window.addEventListener('wheel', (e) => {
  if (wheelLock) return;
  wheelLock = true;
  if (e.deltaY > 12) goTo(current + 1);
  else if (e.deltaY < -12) goTo(current - 1);
  window.setTimeout(() => { wheelLock = false; }, 480);
}, { passive:true });

/* keyboard */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); goTo(current + 1); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp'){ e.preventDefault(); goTo(current - 1); }
});

/* click on empty video area = next (mirrors quick-tap browse behavior) */
track.addEventListener('click', (e) => {
  if (e.target.closest('.right-actions') || e.target.closest('.meta')) return;
  goTo(current + 1);
});

/* touch swipe */
let touchStartY = null;
window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive:true });
window.addEventListener('touchend', (e) => {
  if (touchStartY === null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 60){
    if (dy > 0) goTo(current + 1); else goTo(current - 1);
  }
  touchStartY = null;
}, { passive:true });

/* =========================================================
   ACTION BAR INTERACTIONS
   ========================================================= */
function formatCount(n){
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}
function parseCount(str){
  const s = str.trim();
  const num = parseFloat(s);
  if (s.toUpperCase().includes('M')) return Math.round(num * 1000000);
  if (s.toUpperCase().includes('K')) return Math.round(num * 1000);
  return Math.round(parseFloat(s.replace(/,/g,'')));
}

track.addEventListener('click', (e) => {
  const btn = e.target.closest('.action');
  if (!btn) return;
  e.stopPropagation();
  const slide = btn.closest('.slide');
  const i = Number(slide.dataset.index);
  const kind = btn.dataset.action;

  if (kind === 'like'){
    state[i].liked = !state[i].liked;
    const iconSlot = btn.querySelector('.icon-btn');
    iconSlot.innerHTML = ICON.heart(state[i].liked);
    btn.classList.toggle('liked', state[i].liked);
    const countEl = btn.querySelector('[data-count="likes"]');
    let base = parseCount(VIDEOS[i].likes);
    countEl.textContent = formatCount(base + (state[i].liked ? 1 : 0));
    iconSlot.style.transform = 'scale(1.18)';
    requestAnimationFrame(()=> setTimeout(()=> iconSlot.style.transform = '', 140));
  }

  if (kind === 'save'){
    state[i].saved = !state[i].saved;
    const iconSlot = btn.querySelector('.icon-btn');
    iconSlot.innerHTML = ICON.bookmark(state[i].saved);
    btn.classList.toggle('saved', state[i].saved);
    const countEl = btn.querySelector('[data-count="saves"]');
    let base = parseCount(VIDEOS[i].saves);
    countEl.textContent = formatCount(base + (state[i].saved ? 1 : 0));
  }

  if (kind === 'comment' || kind === 'share'){
    const iconSlot = btn.querySelector('.icon-btn');
    iconSlot.style.transform = 'scale(1.12)';
    setTimeout(()=> iconSlot.style.transform = '', 140);
  }
});

/* top tabs (visual only, matches spec: For You selected) */
document.getElementById('tabFollowing').addEventListener('click', function(){
  this.classList.add('active');
  document.getElementById('tabForYou').classList.remove('active');
});
document.getElementById('tabForYou').addEventListener('click', function(){
  this.classList.add('active');
  document.getElementById('tabFollowing').classList.remove('active');
});

/* bottom nav (visual only) */
document.querySelectorAll('[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-nav]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
